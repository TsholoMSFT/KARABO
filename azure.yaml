name: karabo-api
metadata:
  template: karabo-api@1.0.0
services:
  api:
    project: ./api
    language: ts
    host: function
hooks:
  postprovision:
    windows:
      shell: pwsh
      run: Write-Host "Provision complete. Function App env vars set from Key Vault references."
      continueOnError: true
      interactive: false
    posix:
      shell: sh
      run: echo "Provision complete."
      continueOnError: true
      interactive: false
